<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portafolio Interactivo</title>
<link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ===== Paleta "cozy": blancos cálidos y naranja claro ===== */
  :root{
    --bg:#FFF6EA; --bg-deep:#F3E3CC; --card:#FFFCF6;
    --ink:#4A3426; --ink-soft:#7A5E4A;
    --accent:#F2A65A; --accent-soft:#FFD3A1; --accent-ink:#3A2414; --accent-deep:#C9692A;
    --mint:var(--accent-soft); --mint-deep:var(--accent-deep); --coral:var(--accent); --gold:#FFD9A0;
    --shadow:0 8px 24px rgba(74,52,38,.16);
    --world-bg:radial-gradient(ellipse at 50% 45%, #6A4A36 0%, #3A281E 55%, #1C130E 100%);
  }
  :root[data-theme="dark"]{
    --bg:#3A2D24; --bg-deep:#4A3A2E; --card:#261D17;
    --ink:#F7EADB; --ink-soft:#D6C1AC;
    --accent:#F2A65A; --accent-soft:#5A4030; --accent-deep:#FFB673;
    --shadow:0 8px 24px rgba(0,0,0,.5);
    --world-bg:radial-gradient(ellipse at 50% 45%, #2B2C45 0%, #171827 55%, #0A0A12 100%);
  }

  html,body{ height:100%; overflow:hidden; background:#1C130E; }
  #world{ position:fixed; inset:0; background:var(--world-bg); transition:background .8s ease; }
  #world canvas{ width:100%; height:100%; aspect-ratio:auto; display:block; touch-action:none; }

  /* ===== HUD ===== */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:20; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px 12px;
  }
  #hud > *{ pointer-events:auto; }
  #pageTitle{ color:#FFF6EA; text-shadow:0 2px 12px rgba(0,0,0,.55); font-size:clamp(18px,3.2vw,28px); text-align:center; }
  .nav-btn{ background:var(--card); color:var(--ink-soft); font-size:14px; }
  .nav-btn.active{ background:var(--accent); color:var(--accent-ink); }
  .icon-btn{ background:var(--card); color:var(--ink); }
  #listBtn{ width:auto; padding:0 16px; border-radius:20px; font-size:14px; gap:6px; }
  #hint{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:20;
    font-family:'Quicksand',sans-serif; font-weight:600; font-size:14px; color:#FFF6EA;
    background:rgba(40,26,18,.6); padding:8px 16px; border-radius:16px; text-align:center;
    max-width:calc(100% - 32px);
  }
  #prompt{
    z-index:15; background:var(--accent); color:var(--accent-ink);
    font-size:15px; padding:8px 14px; border-radius:16px;
  }
  #prompt kbd{
    display:inline-block; background:var(--accent-ink); color:#FFF6EA; border-radius:6px;
    padding:0 7px; margin-right:7px; font-family:inherit; font-size:13px;
  }
  #loadingMsg{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#FFF6EA; z-index:30; font-size:18px;
  }

  /* ===== Paneles de detalle: más grandes y legibles ===== */
  #overlay{ padding:24px; background:rgba(28,18,12,.45); }
  #panel{
    width:100%; max-width:min(940px, 100%); max-height:90vh;
    padding:30px 44px 40px; border-radius:26px; background:var(--card); color:var(--ink);
  }
  #panel .closeBtn{
    position:sticky; top:0; float:right; z-index:2;
    width:44px; height:44px; font-size:20px; margin:-6px -20px 8px 12px;
    background:var(--bg); color:var(--ink); box-shadow:var(--shadow);
  }
  #panel h2{ font-size:32px; margin:6px 0 20px; color:var(--ink); }
  #panel h3.entry-title{ margin:10px 0 6px; font-size:26px; }
  #panel .entry{ border-bottom-color:var(--bg-deep); margin-bottom:22px; padding-bottom:22px; }
  #panel .entry-title{ font-size:22px; }
  #panel .entry-year{ font-size:16px; color:var(--accent-deep); }
  #panel .entry-desc{ font-size:18px; line-height:1.65; color:var(--ink-soft); }
  #panel .tag{ font-size:14px; padding:4px 11px; margin:4px 0 0 6px; background:var(--bg); color:var(--ink-soft); }
  #panel a.entry-link{ font-size:16px; padding:10px 20px; margin-top:14px; background:var(--accent); color:var(--accent-ink); }
  #panel .bullet-list li{ font-size:18px; padding:14px 18px; background:var(--bg); color:var(--ink-soft); }
  #panel .profile-photo{ width:150px; height:150px; }
  #panel .profile-name{ font-size:26px; }
  #panel .music-disclaimer{ font-size:17px; color:var(--ink-soft); white-space:pre-line; }
  #panel .game-grid{ grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:20px; }
  #panel .game-card img{ background:var(--bg); }
  #panel .game-name{ font-size:17px; }
  #panel .game-desc{ font-size:15px; color:var(--ink-soft); }
  #panel .spotify-embed{ height:152px; }

  .proj-detail{ display:grid; grid-template-columns:1.25fr 1fr; gap:30px; align-items:start; }
  .proj-detail .project-thumb-wrap{ border-radius:18px; }
  .proj-detail h2{ margin:10px 0 10px !important; }

  /* Vista en lista */
  #panel.wide{ max-width:min(1100px, 100%); }
  /* la barra de pestañas cubre también el relleno superior del panel, para que el contenido no se asome por encima */
  .list-tabs{
    position:sticky; top:-30px; z-index:1; display:flex; flex-wrap:wrap; gap:8px;
    background:var(--card); padding:34px 56px 14px 0; margin-top:-30px;
  }
  :root[data-theme="dark"]{ color-scheme:dark; }
  .list-tabs button{
    font-family:'Quicksand',sans-serif; font-weight:700; font-size:15px; cursor:pointer;
    border:none; border-radius:18px; padding:9px 16px; background:var(--bg); color:var(--ink);
  }
  .list-tabs button:hover{ background:var(--accent-soft); }
  .list-section{ scroll-margin-top:80px; padding-top:10px; }
  .list-section > .section-title{
    font-family:'Quicksand',sans-serif; font-size:36px; font-weight:700; margin:18px 0 6px;
    padding-bottom:8px; border-bottom:3px solid var(--accent);
  }
  .list-section h2{ font-size:24px !important; margin-top:26px !important; }
  .list-section .proj-detail{ margin-bottom:8px; }

  @media (max-width:760px){
    .proj-detail{ grid-template-columns:1fr; gap:16px; }
  }
  /* Celular: el panel ocupa toda la pantalla */
  @media (max-width:640px){
    #overlay{ padding:0; align-items:stretch; }
    #panel{ max-width:100%; max-height:none; height:100dvh; border-radius:0; padding:16px 18px 32px; }
    #panel .closeBtn{ margin:0 -4px 6px 10px; }
    #panel h2{ font-size:26px; }
    #panel .entry-desc{ font-size:17px; }
    #panel .game-grid{ grid-template-columns:repeat(2,1fr); gap:14px; }
    /* en celular las pestañas van en una sola fila que se desliza de lado */
    .list-tabs{ top:-16px; margin-top:-16px; padding:20px 0 12px; margin-right:52px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
    .list-tabs button{ font-size:14px; padding:8px 12px; white-space:nowrap; flex:0 0 auto; }
    .list-section{ scroll-margin-top:64px; }
    .list-section > .section-title{ font-size:28px; }
    #pageTitle{ display:none; }
    #hud{ padding:10px 8px; gap:6px; }
    .nav-btn{ font-size:12px; padding:8px 12px; }
    #listBtn .lbl{ display:none; }
    #listBtn{ width:40px; padding:0; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>

<div id="world">
  <div id="prompt"></div>
</div>

<div id="hud">
  <h1 id="pageTitle"></h1>
  <div id="topBar">
    <div id="nav"></div>
    <div id="controls">
      <button class="icon-btn" id="listBtn"><span>☰</span><span class="lbl"></span></button>
      <button class="icon-btn" id="themeBtn">🌙</button>
      <button class="icon-btn" id="langBtn">EN</button>
    </div>
  </div>
</div>

<div id="hint"></div>
<div id="loadingMsg">Cargando...</div>

<div id="overlay">
  <div id="panel">
    <button class="closeBtn" id="closePanel" aria-label="Cerrar">✕</button>
    <div id="panelBody"></div>
  </div>
</div>

<script type="module" src="js/explorar.js"></script>
</body>
</html>
